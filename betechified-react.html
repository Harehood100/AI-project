<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Profile Cards</title>
  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function ProfileCard({ picture, name, age }) {
      return (
        <div style={{ border: '1px solid #ccc', padding: '10px', margin: '10px', width: '200px' }}>
          <img src={picture} alt={name} style={{ width: '100px', height: '100px' }} />
          <h3>{name}</h3>
          <p>Age: {age}</p>
        </div>
      );
    }

    function App() {
      return (
        <div>
          <h1>Profile Cards</h1>
          <ProfileCard picture="./images.jpg" name="John Doe" age={25} />
          <ProfileCard picture="./images (1).jpg" name="Jane Smith" age={30} />
          <ProfileCard picture="./images (2).jpg" name="Bob Johnson" age={35} />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
